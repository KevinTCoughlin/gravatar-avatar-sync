name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! scripts/validate-version.sh "$version"; then
            echo "Invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"

      - name: Build source archive
        run: |
          git archive \
            --format=tar.gz \
            --prefix="gravatar-avatar-sync-${{ steps.version.outputs.VERSION }}/" \
            -o "gravatar-avatar-sync-${{ steps.version.outputs.VERSION }}.tar.gz" \
            "$GITHUB_REF_NAME"

      - name: Extract changelog for this release
        id: changelog
        run: |
          version="${{ steps.version.outputs.VERSION }}"
          # Extract the section between this version header and the next header
          notes="$(awk -v heading="## [$version]" '
            /^## \[/ {
              if (found) exit
              if (index($0, heading) == 1) {
                found = 1
                next
              }
            }
            found { print }
          ' CHANGELOG.md)"
          if [[ -z "${notes//[[:space:]]/}" ]]; then
            echo "No CHANGELOG.md section found for version $version" >&2
            exit 1
          fi
          {
            echo "NOTES<<EOF"
            echo "$notes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: "v${{ steps.version.outputs.VERSION }}"
          body: ${{ steps.changelog.outputs.NOTES }}
          files: "gravatar-avatar-sync-${{ steps.version.outputs.VERSION }}.tar.gz"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
